# The tracker keeps running on port 9090; PiAware's pages stay on port 80.
$HTTP["url"] == "/overtheroof" {
    url.redirect = ( "^/overtheroof$" => "/overtheroof/" )
}
$HTTP["url"] =~ "^/overtheroof/" {
    proxy.server = ( "" => (( "host" => "127.0.0.1", "port" => 9090 )) )
    proxy.header = ( "map-urlpath" => ( "/overtheroof/" => "/" ) )
}
