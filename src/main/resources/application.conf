ktor {
  deployment.port = 9090
  application.modules = [com.codingpitch.aircrafttracker.ApplicationKt.serviceModule]
}

external.services {
  flight-data-provider.host = "192.168.1.200"
  flight-data-provider.host = ${?PIAWARE_HOST}
  flight-data-provider.port = "8080"
  flight-data-provider.port = ${?PIAWARE_PORT}
  route-provider.url = "https://api.adsbdb.com/v0"
}

# Compact passage summaries; the service user must be able to write this path.
history {
  log-file = ${?LOG_FILE}
  enabled = true
  enabled = ${?HISTORY_ENABLED}
  radius-km = 2.0
  radius-km = ${?HISTORY_RADIUS_KM}
  file = "data/overflights.json"
  file = ${?HISTORY_FILE}
}
